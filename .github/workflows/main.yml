name: Heikin Ashi Hourly Alert

on:
  schedule:
    # 매시 정각마다 실행 (UTC 기준 0분 = 한국시간 매시 정각)
    - cron: '0 * * * *'
  # GitHub 탭에서 수동 실행 버튼 활성화
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 저장소 코드 불러오기
      uses: actions/checkout@v3

    - name: 파이썬 3.10 환경 설정
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 라이브러리 설치
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 하이킨아시 분석 및 텔레그램 전송 실행
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        CHAT_ID: ${{ secrets.CHAT_ID }}
      run: python main.py
