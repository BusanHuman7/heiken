name: Bithumb Heikin Ashi Alert

on:
  schedule:
    # 업비트와 시간이 겹치지 않게 하려면 1~2분 정도 뒤에 실행되도록 설정 가능 (예: 매시 1분)
    - cron: '1 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 저장소 코드 불러오기
      uses: actions/checkout@v3

    - name: 파이썬 3.10 환경 설정
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 라이브러리 설치
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 빗썸 하이킨아시 분석 및 텔레그램 전송 실행
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        CHAT_ID: ${{ secrets.CHAT_ID }}
      run: python bithumb_main.py
